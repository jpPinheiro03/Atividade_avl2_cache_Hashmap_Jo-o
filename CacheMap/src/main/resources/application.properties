spring.application.name=CacheMap

# Configuracao do cache proprio
app.cache.max-itens=5
app.cache.ttl-segundos=60


app.fonte.atraso-ms=2000

# H2 em memoria
spring.datasource.url=jdbc:h2:mem:cachemap;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Console H2 (opcional): http://localhost:8080/h2-console
spring.h2.console.enabled=true
